<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Swipe Music Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #0f0f1b;
            --card: #1e1e2e;
            --text-dim: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: pan-y;
            /* อนุญาตให้เลื่อนขึ้นลงได้ แต่คุมการปัดซ้ายขวาด้วย JS */
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: var(--card);
            border-radius: 40px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            background: #2a2a3d;
            color: #fff;
            border: none;
            margin-bottom: 20px;
            outline: none;
            font-size: 14px;
        }

        #title {
            font-size: 24px;
            margin-bottom: 5px;
        }

        #artist {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .lyrics-window {
            height: 250px;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
            mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent);
            -webkit-mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent);
        }

        #lyricsContainer {
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            padding-top: 100px;
        }

        .lrc-line {
            padding: 15px 0;
            font-size: 19px;
            color: var(--text-dim);
            transition: all 0.4s ease;
            line-height: 1.5;
            text-align: center;
        }

        .lrc-line.active {
            color: var(--primary);
            font-weight: bold;
            transform: scale(1.1);
        }

        .progress-area {
            margin-top: 10px;
            padding: 10px 0;
            cursor: pointer;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* ปรับปรุงปุ่มควบคุมให้เท่ากันและสวยงาม */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .play-btn {
            width: 75px;
            height: 75px;
            background: #fff;
            color: #0f0f1b;
            font-size: 30px;
            border: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .stop-btn {
            color: #ff4d6d;
            border-color: rgba(255, 77, 109, 0.3);
        }

        .hint-text {
            font-size: 11px;
            color: #555;
            margin-top: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="container" id="playerCard">
        <select id="songPicker">
            <option>กำลังโหลดเพลง...</option>
        </select>

        <h2 id="title">ชื่อเพลง</h2>
        <p id="artist">ศิลปิน</p>

        <div class="lyrics-window">
            <div id="lyricsContainer"></div>
        </div>

        <div class="progress-area" id="progressTrack">
            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="prev()">⏮</button>
            <button id="playBtn" class="control-btn play-btn" onclick="togglePlay()">▶</button>
            <button class="control-btn stop-btn" onclick="stopSong()">⏹</button>
            <button class="control-btn" onclick="next()">⏭</button>
        </div>
        <p class="hint-text">ปัดหน้าจอ หรือสลับแอปเพื่อปิดเพลง</p>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        let songList = [];
        let currentLrc = [];
        const audio = document.getElementById('audioPlayer');
        const lyricsContainer = document.getElementById('lyricsContainer');
        const playBtn = document.getElementById('playBtn');
        const playerCard = document.getElementById('playerCard');

        // 1. โหลดข้อมูลเพลง
        Papa.parse("songs.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: (results) => {
                songList = results.data;
                if (songList.length > 0) {
                    const picker = document.getElementById('songPicker');
                    picker.innerHTML = songList.map((s, i) => `<option value="${i}">${s.title}</option>`).join('');
                    picker.onchange = (e) => loadSong(parseInt(e.target.value), true);
                    loadSong(0);
                }
            }
        });

        async function loadSong(idx, autoPlay = false) {
            const s = songList[idx];
            document.getElementById('title').innerText = s.title;
            document.getElementById('artist').innerText = s.artist;
            audio.src = s.audio_file;

            try {
                const res = await fetch(s.lrc_file);
                const text = await res.text();
                currentLrc = parseLRC(text);
                lyricsContainer.innerHTML = currentLrc.map((l, i) => `<div class="lrc-line" id="line-${i}">${l.text}</div>`).join('');
            } catch (e) {
                lyricsContainer.innerHTML = '<div class="lrc-line">ไม่พบเนื้อเพลง</div>';
                currentLrc = [];
            }

            stopSong();
            if (autoPlay) play();
        }

        function parseLRC(text) {
            return text.split('\n').map(line => {
                const m = line.match(/\[(\d{2}):(\d{2})\.(\d{2})\](.*)/);
                return m ? { time: parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3]) / 100, text: m[4].trim() } : null;
            }).filter(x => x);
        }

        function togglePlay() { audio.paused ? play() : pause(); }
        function play() { audio.play(); playBtn.innerText = '⏸'; }
        function pause() { audio.pause(); playBtn.innerText = '▶'; }

        function stopSong() {
            audio.pause();
            audio.currentTime = 0;
            playBtn.innerText = '▶';
            document.getElementById('progress').style.width = '0%';
            lyricsContainer.style.transform = `translateY(0px)`;
            document.querySelectorAll('.lrc-line').forEach(l => l.classList.remove('active'));
        }

        audio.ontimeupdate = () => {
            const prog = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = prog + '%';

            const idx = currentLrc.findLastIndex(l => audio.currentTime >= l.time);
            if (idx !== -1) {
                const lines = document.querySelectorAll('.lrc-line');
                lines.forEach((l, i) => l.classList.toggle('active', i === idx));

                const activeLine = document.getElementById(`line-${idx}`);
                const windowHeight = 250;
                const offset = activeLine.offsetTop - (windowHeight / 2) + (activeLine.offsetHeight / 2);
                lyricsContainer.style.transform = `translateY(-${offset}px)`;
            }
        };

        // 2. ระบบ Swipe (ปัดซ้าย-ขวาเพื่อปิด)
        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            if (Math.abs(touchEndX - touchStartX) > 100) {
                stopSong();
                playerCard.style.transform = 'scale(0.9) rotate(5deg)';
                setTimeout(() => playerCard.style.transform = 'scale(1) rotate(0deg)', 200);
            }
        });

        // 3. ระบบตรวจจับการออกจากหน้าเว็บ/สลับหน้า (ปัดเปลี่ยนหน้า/ย้อนกลับ)
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) stopSong();
        });

        window.addEventListener("pagehide", stopSong);
        window.onpopstate = stopSong;

        // 4. การควบคุมลำดับเพลง
        function next() {
            let idx = (parseInt(document.getElementById('songPicker').value) + 1) % songList.length;
            document.getElementById('songPicker').value = idx;
            loadSong(idx, true);
        }

        function prev() {
            let idx = (parseInt(document.getElementById('songPicker').value) - 1 + songList.length) % songList.length;
            document.getElementById('songPicker').value = idx;
            loadSong(idx, true);
        }

        audio.onended = next;
        document.getElementById('progressTrack').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        };

    </script>
</body>

</html>
