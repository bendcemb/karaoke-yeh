<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swipe to Change Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #05050a;
            --card: #161625;
            --text-dim: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: pan-y;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: var(--card);
            border-radius: 40px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            background: #252538;
            color: #fff;
            border: none;
            margin-bottom: 20px;
            outline: none;
            font-size: 14px;
            appearance: none;
        }

        #title { font-size: 24px; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #artist { color: #aaa; font-size: 14px; margin-bottom: 20px; }

        .lyrics-window {
            height: 260px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
            mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent);
            -webkit-mask-image: linear-gradient(transparent, #000 20%, #000 80%, transparent);
        }

        #lyricsContainer {
            transition: transform 0.5s cubic-bezier(0.17, 0.67, 0.12, 1);
            padding-top: 110px;
        }

        .lrc-line {
            padding: 12px 0;
            font-size: 18px;
            color: var(--text-dim);
            transition: all 0.3s ease;
            line-height: 1.5;
        }

        .lrc-line.active {
            color: var(--primary);
            font-weight: bold;
            transform: scale(1.08);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .progress-area {
            margin: 15px 0;
            cursor: pointer;
            padding: 10px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        #progress {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            width: 0%;
            border-radius: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .control-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .play-btn {
            width: 74px;
            height: 74px;
            background: #fff;
            color: #000;
            border: none;
            font-size: 32px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .stop-btn {
            color: #ff4d6d;
            border-color: rgba(255, 77, 109, 0.2);
        }

        .hint-text {
            font-size: 11px;
            color: #444;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="container" id="playerCard">
        <select id="songPicker">
            <option>กำลังเชื่อมต่อข้อมูล...</option>
        </select>
        
        <h2 id="title">ชื่อเพลง</h2>
        <p id="artist">ศิลปิน</p>

        <div class="lyrics-window">
            <div id="lyricsContainer"></div>
        </div>

        <div class="progress-area" id="progressTrack">
            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="prev()">⏮</button>
            <button id="playBtn" class="control-btn play-btn" onclick="togglePlay()">▶</button>
            <button class="control-btn stop-btn" onclick="stopSong()">⏹</button>
            <button class="control-btn" onclick="next()">⏭</button>
        </div>
        <p class="hint-text">ปัดซ้าย-ขวาเพื่อเปลี่ยนเพลง</p>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        let songList = [];
        let currentLrc = [];
        const audio = document.getElementById('audioPlayer');
        const lyricsContainer = document.getElementById('lyricsContainer');
        const playBtn = document.getElementById('playBtn');
        const playerCard = document.getElementById('playerCard');
        const picker = document.getElementById('songPicker');

        // 1. โหลดข้อมูลเพลง
        Papa.parse("songs.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: (results) => {
                songList = results.data;
                if (songList.length > 0) {
                    picker.innerHTML = songList.map((s, i) => `<option value="${i}">${s.title}</option>`).join('');
                    picker.onchange = (e) => loadSong(parseInt(e.target.value), true);
                    loadSong(0);
                }
            }
        });

        async function loadSong(idx, autoPlay = false) {
            const s = songList[idx];
            picker.value = idx;
            document.getElementById('title').innerText = s.title;
            document.getElementById('artist').innerText = s.artist;
            audio.src = s.audio_file;
            
            try {
                const res = await fetch(s.lrc_file);
                const text = await res.text();
                currentLrc = parseLRC(text);
                lyricsContainer.innerHTML = currentLrc.map((l, i) => `<div class="lrc-line" id="line-${i}">${l.text}</div>`).join('');
            } catch (e) { 
                lyricsContainer.innerHTML = '<div class="lrc-line">ไม่มีเนื้อเพลง</div>'; 
                currentLrc = [];
            }
            
            // รีเซ็ตตำแหน่งหน้าจอเนื้อเพลง
            lyricsContainer.style.transform = `translateY(0px)`;
            if (autoPlay) play(); else stopSong();
        }

        function parseLRC(text) {
            return text.split('\n').map(line => {
                const m = line.match(/\[(\d{2}):(\d{2})\.(\d{2})\](.*)/);
                return m ? { time: parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3]) / 100, text: m[4].trim() } : null;
            }).filter(x => x);
        }

        function togglePlay() { audio.paused ? play() : pause(); }
        function play() { audio.play(); playBtn.innerText = '⏸'; }
        function pause() { audio.pause(); playBtn.innerText = '▶'; }

        function stopSong() {
            audio.pause();
            audio.currentTime = 0;
            playBtn.innerText = '▶';
            document.getElementById('progress').style.width = '0%';
            lyricsContainer.style.transform = `translateY(0px)`;
            document.querySelectorAll('.lrc-line').forEach(l => l.classList.remove('active'));
        }

        audio.ontimeupdate = () => {
            if (!audio.duration) return;
            const prog = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = prog + '%';
            
            const idx = currentLrc.findLastIndex(l => audio.currentTime >= l.time);
            if (idx !== -1) {
                document.querySelectorAll('.lrc-line').forEach((l, i) => l.classList.toggle('active', i === idx));
                const activeLine = document.getElementById(`line-${idx}`);
                const offset = activeLine.offsetTop - 110; 
                lyricsContainer.style.transform = `translateY(-${offset}px)`;
            }
        };

        // 2. ปรับปรุงระบบ Swipe (ซ้าย=ก่อนหน้า, ขวา=ถัดไป)
        let touchStartX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        document.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchEndX - touchStartX;
            const threshold = 80; // ระยะปัดขั้นต่ำ

            if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // ปัดขวา -> เพลงถัดไป
                    next();
                    playerCard.style.transform = 'translateX(20px)';
                } else {
                    // ปัดซ้าย -> เพลงก่อนหน้า
                    prev();
                    playerCard.style.transform = 'translateX(-20px)';
                }
                setTimeout(() => playerCard.style.transform = 'translateX(0)', 200);
            }
        }, {passive: true});

        // 3. ระบบหยุดเพลงเมื่อออกจากหน้าจอ
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) pause(); 
        });
        window.addEventListener("pagehide", pause);

        // 4. ระบบเปลี่ยนเพลง
        function next() {
            let idx = (parseInt(picker.value) + 1) % songList.length;
            loadSong(idx, true);
        }

        function prev() {
            let idx = (parseInt(picker.value) - 1 + songList.length) % songList.length;
            loadSong(idx, true);
        }

        audio.onended = next;

        document.getElementById('progressTrack').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        };

    </script>
</body>

</html>
